  :root{color-scheme:light dark;font-family:system-ui,sans-serif}

<h1>CYD APRS Map</h1>
<p>Plug the CYD in over USB, then click a button. Needs Chrome or Edge (Web Serial).</p>
<div class="card"><h3>Board with USB-C + micro-USB</h3>
  <esp-web-install-button manifest="manifest-st7789.json"></esp-web-install-button></div>
<div class="card"><h3>Board with micro-USB only</h3>
  <esp-web-install-button manifest="manifest-ili9341.json"></esp-web-install-button></div>
<p>After flashing, join the Wi-Fi network <b>CYD-APRS-Setup</b> and open <b>192.168.4.1</b> to enter your Wi-Fi, callsign, home position and radius.</p>
