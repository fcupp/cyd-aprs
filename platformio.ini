[platformio]
default_envs = cyd, cyd_ili9341

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
    -DSPI_FREQUENCY=40000000 -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1 -DLOAD_FONT2=1

; CYD with USB-C + micro-USB (ST7789 panel)
[env:cyd]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=320
    ; if colours look inverted, add -DCYD_FLIP_INVERT=1

; Older CYD with micro-USB only (ILI9341 panel)
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1 -DTFT_WIDTH=240 -DTFT_HEIGHT=320
